<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divine Buddha - Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="login-card">
      <h1 class="mb-4"><span class="text-primary">Divine</span> Buddha</h1>
      <p class="text-muted mb-4">
        Please log in with Discord to access the dashboard.
      </p>

      <a href="/auth/discord" class="btn btn-discord btn-lg w-100">
        Log in with Discord
      </a>

      <div class="mt-4 small text-muted">
        Access requires <strong>Moderator</strong> or
        <strong>Admin</strong> role.
      </div>

      <div id="error-message" class="alert alert-danger mt-3 d-none">
        You do not have permission to access the dashboard.
      </div>
    </div>

    <script src="js/login.js"></script>
  </body>
</html>
