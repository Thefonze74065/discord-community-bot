<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divine Buddha - Giveaways</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  </head>
  <body>
    <div id="navbar-app"></div>
    <div id="app" class="container py-4">
      <h2 class="mb-4 text-center">Manage Giveaways</h2>
      <div class="card mb-4">
        <div class="card-header bg-primary text-white">Create New Giveaway</div>
        <div class="card-body">
          <form @submit.prevent="createGiveaway">
            <div class="mb-3">
              <label class="form-label">Prize</label>
              <input
                v-model="newGiveaway.prize"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label"
                >Sponsors (Discord IDs, comma separated)</label
              >
              <input
                v-model="newGiveaway.sponsors"
                class="form-control"
                placeholder="123,456"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label">End Time (UTC)</label>
              <input
                v-model="newGiveaway.endTime"
                type="datetime-local"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Number of Winners</label>
              <input
                v-model.number="newGiveaway.winnerCount"
                type="number"
                min="1"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Channel</label>
              <select
                v-model="newGiveaway.channelId"
                class="form-select"
                required
              >
                <option value="" disabled>Select a channel...</option>
                <option
                  v-for="channel in channels"
                  :key="channel.id"
                  :value="channel.id"
                >
                  #{{ channel.name }}
                </option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Description/Extra Info</label>
              <textarea
                v-model="newGiveaway.description"
                class="form-control"
                rows="2"
              ></textarea>
            </div>
            <button class="btn btn-success" :disabled="creating">
              {{ creating ? 'Creating...' : 'Create Giveaway' }}
            </button>
          </form>
        </div>
      </div>
      <div class="card">
        <div class="card-header bg-secondary text-white">Active Giveaways</div>
        <div class="card-body p-0">
          <table class="table table-dark table-striped mb-0">
            <thead>
              <tr>
                <th>Prize</th>
                <th>Channel</th>
                <th>Ends</th>
                <th>Winners</th>
                <th>Sponsors</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="g in giveaways" :key="g.id">
                <td>{{ g.prize }}</td>
                <td>#{{ g.channelName }}</td>
                <td>{{ formatDate(g.endTime) }}</td>
                <td>{{ g.winnerCount }}</td>
                <td>{{ g.sponsors.join(', ') }}</td>
                <td>
                  <span v-if="g.ended" class="badge bg-danger">Ended</span>
                  <span v-else class="badge bg-success">Active</span>
                </td>
                <td class="d-flex gap-2">
                  <button
                    v-if="!g.ended"
                    class="btn btn-sm btn-warning"
                    @click="endGiveaway(g.id)"
                  >
                    End Now
                  </button>
                  <button
                    v-if="!g.ended"
                    class="btn btn-sm btn-info"
                    @click="openEditGiveaway(g)"
                  >
                    Edit
                  </button>
                  <button
                    v-if="g.ended"
                    class="btn btn-sm btn-primary"
                    @click="rerollGiveaway(g.id, false)"
                    title="Reroll invalid winners only"
                  >
                    <i class="bi bi-arrow-clockwise"></i> Reroll Invalid
                  </button>
                  <button
                    v-if="g.ended"
                    class="btn btn-sm btn-secondary"
                    @click="rerollGiveaway(g.id, true)"
                    title="Reroll all winners"
                  >
                    <i class="bi bi-arrow-repeat"></i> Reroll All
                  </button>
                  <button
                    class="btn btn-sm btn-danger"
                    @click="deleteGiveaway(g.id)"
                  >
                    Delete
                  </button>
                </td>
              </tr>
              <tr v-if="giveaways.length === 0">
                <td colspan="7" class="text-center">No giveaways found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Edit Giveaway Modal -->
      <div
        class="modal fade"
        id="editGiveawayModal"
        tabindex="-1"
        aria-labelledby="editGiveawayModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="editGiveawayModalLabel">
                Edit Giveaway
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form @submit.prevent="submitEditGiveaway">
                <div class="mb-3">
                  <label class="form-label">Prize</label>
                  <input
                    v-model="editGiveaway.prize"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label"
                    >Sponsors (Discord IDs, comma separated)</label
                  >
                  <input
                    v-model="editGiveaway.sponsors"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">End Time (UTC)</label>
                  <input
                    v-model="editGiveaway.endTime"
                    type="datetime-local"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Number of Winners</label>
                  <input
                    v-model.number="editGiveaway.winnerCount"
                    type="number"
                    min="1"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Channel</label>
                  <select
                    v-model="editGiveaway.channelId"
                    class="form-select"
                    required
                  >
                    <option value="" disabled>Select a channel...</option>
                    <option
                      v-for="channel in channels"
                      :key="channel.id"
                      :value="channel.id"
                    >
                      #{{ channel.name }}
                    </option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Description/Extra Info</label>
                  <textarea
                    v-model="editGiveaway.description"
                    class="form-control"
                    rows="2"
                  ></textarea>
                </div>
                <button class="btn btn-primary" :disabled="editingGiveaway">
                  {{ editingGiveaway ? 'Saving...' : 'Save Changes' }}
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/giveaways.js"></script>
  </body>
</html>
